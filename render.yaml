services:
  - type: web
    name: mini-e-commerce
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:production
    startCommand: pnpm start:production
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: FAKE_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
