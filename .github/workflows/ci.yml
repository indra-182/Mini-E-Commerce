name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mini_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mini_ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: "0"
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/mini_ecommerce_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/mini_ecommerce_test
      COOKIE_SECRET: ci-cookie-secret
      FAKE_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      PUBLIC_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run verification gates
        run: pnpm verify
